name: Aggiorna catalogo espositori

on:
  workflow_dispatch:
  schedule:
    # Tutti i giorni alle 04:17 UTC (06:17 ora italiana estiva, 05:17 invernale).
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogo-pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Scarica e valida il catalogo
        run: python scraper.py --output index.html
      - name: Commit della verifica e delle eventuali modifiche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html last-check.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiornamento/verifica catalogo espositori'
            git push
          fi
      # Su Pages va solo la pagina del catalogo, non l'intero repository.
      - name: Prepara il contenuto da pubblicare
        run: |
          mkdir _site
          cp index.html _site/
      - name: Configura GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Carica artefatto per Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - name: Pubblica GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
